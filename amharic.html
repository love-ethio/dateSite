<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&family=Noto+Serif+Ethiopic:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #ff2d6f;
      --rose-soft: #ff6f9c;
      --blush: #ffe3ee;
      --cream: #fffaf5;
      --ink: #4a2b38;
      --muted: #a97d90;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 4vw, 24px);
      font-family: "Noto Sans Ethiopic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #ffe6f0 0%, #ffd6e7 45%, #ffeef6 100%);
      overflow-x: hidden;
    }

    /* ---------- floating flowers ---------- */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .petal {
      position: absolute;
      top: -60px;
      opacity: 0.7;
      animation: fall linear infinite;
      will-change: transform;
    }

    @keyframes fall {
      0%   { transform: translateY(-60px) rotate(0deg); }
      100% { transform: translateY(105vh) rotate(360deg); }
    }

    /* ---------- card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(6px);
      border: 1px solid #ffd0e0;
      border-radius: 28px;
      padding: clamp(24px, 6vw, 40px) clamp(18px, 5vw, 34px);
      box-shadow: 0 24px 60px rgba(255, 45, 111, 0.22);
      text-align: center;
      animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .emoji-row { font-size: clamp(30px, 8vw, 40px); letter-spacing: 6px; margin-bottom: 10px; }

    h1, h2 {
      font-family: "Noto Serif Ethiopic", serif;
      color: var(--rose);
      font-weight: 700;
      line-height: 1.35;
      margin: 0 0 14px;
    }

    h1 { font-size: clamp(26px, 7vw, 40px); }
    h2 { font-size: clamp(22px, 6vw, 32px); }

    p.lead {
      margin: 0 0 26px;
      font-size: clamp(14px, 3.7vw, 16px);
      font-weight: 400;
      color: var(--muted);
      line-height: 1.7;
    }

    .tagline {
      min-height: 26px;
      font-size: clamp(14px, 3.6vw, 15px);
      color: var(--rose-soft);
      margin: 0 0 24px;
      transition: opacity 0.3s ease;
      line-height: 1.6;
    }

    /* ---------- buttons ---------- */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      border-radius: 999px;
      transition: transform 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-primary {
      padding: 15px clamp(28px, 8vw, 46px);
      font-size: clamp(16px, 4.4vw, 19px);
      color: #fff;
      background: linear-gradient(135deg, var(--rose-soft), var(--rose));
      box-shadow: 0 12px 26px rgba(255, 45, 111, 0.4);
    }

    .btn-primary:hover { box-shadow: 0 16px 32px rgba(255, 45, 111, 0.5); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-no {
      padding: 15px 38px;
      font-size: clamp(15px, 4vw, 17px);
      color: #8a7a83;
      background: #efe7ec;
      transform-origin: center;
    }

    .btn-block { width: 100%; padding: 16px; font-size: clamp(16px, 4.4vw, 18px); }

    /* ---------- form ---------- */
    .field { text-align: left; margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: clamp(12px, 3.2vw, 13px);
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="date"], input[type="time"], textarea {
      width: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #ffd0e0;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="date"]:focus, input[type="time"]:focus, textarea:focus {
      border-color: var(--rose-soft);
      box-shadow: 0 0 0 4px rgba(255, 111, 156, 0.15);
    }

    textarea { resize: vertical; min-height: 90px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .plan-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      font-size: clamp(13px, 3.5vw, 14px);
      background: #fff;
      border: 1.5px solid #ffdbe8;
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }

    .plan-option:hover { transform: translateY(-1px); }
    .plan-option input { display: none; }

    .plan-option:has(input:checked) {
      border-color: var(--rose);
      background: #fff0f6;
      box-shadow: 0 6px 16px rgba(255, 45, 111, 0.15);
    }

    #sealBtn {
      margin-top: 6px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #sealBtn.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .reveal-hint {
      margin: 14px 0 0;
      font-size: clamp(12px, 3.2vw, 13px);
      color: var(--muted);
      line-height: 1.6;
    }

    /* ---------- የኢትዮጵያ ቀን መቁጠሪያ ---------- */
    .calendar {
      background: #fff;
      border: 1px solid #ffd0e0;
      border-radius: 16px;
      padding: clamp(10px, 3vw, 14px);
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-title {
      font-family: "Noto Serif Ethiopic", serif;
      font-weight: 700;
      color: var(--rose);
      font-size: clamp(13px, 3.6vw, 16px);
    }

    .cal-nav {
      border: none;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: #fff0f6;
      color: var(--rose);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .cal-nav:hover { background: #ffe0ec; }
    .cal-nav:disabled { opacity: 0.35; cursor: default; }

    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays { margin-bottom: 6px; }

    .cal-weekdays span {
      text-align: center;
      font-size: clamp(9px, 2.6vw, 11px);
      font-weight: 600;
      color: var(--muted);
    }

    .cal-cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 50%;
      font-family: inherit;
      font-size: clamp(12px, 3.4vw, 14px);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .cal-day:hover { background: #fff0f6; }

    .cal-day.selected {
      background: linear-gradient(135deg, var(--rose-soft), var(--rose));
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(255, 45, 111, 0.3);
    }

    .cal-day.disabled { color: #dcc9d2; cursor: default; }
    .cal-day.disabled:hover { background: transparent; }

    .cal-empty { visibility: hidden; }

    /* ---------- የሰዓት መራጫ (ቀን / ማታ) ---------- */
    .time-picker {
      background: #fff;
      border: 1px solid #ffd0e0;
      border-radius: 16px;
      padding: clamp(10px, 3vw, 14px);
      text-align: center;
    }

    .tp-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tp-select {
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fff0f6;
      border: 1px solid #ffd0e0;
      border-radius: 10px;
      padding: 8px 6px;
      cursor: pointer;
    }

    .tp-select:focus {
      outline: none;
      border-color: var(--rose-soft);
      box-shadow: 0 0 0 3px rgba(255, 111, 156, 0.15);
    }

    .tp-colon { font-weight: 700; color: var(--rose); font-size: 18px; }

    .tp-period {
      display: flex;
      gap: 4px;
      background: #fff0f6;
      border-radius: 999px;
      padding: 3px;
    }

    .tp-period-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-weight: 600;
      font-size: clamp(12px, 3.4vw, 13px);
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tp-period-btn.active {
      background: linear-gradient(135deg, var(--rose-soft), var(--rose));
      color: #fff;
    }

    /* ---------- letter ---------- */
    .recap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .recap .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: clamp(12px, 3.2vw, 13px);
      font-weight: 600;
      color: var(--rose);
      background: #fff0f6;
      border: 1px solid #ffd0e0;
      border-radius: 999px;
    }

    .letter {
      text-align: left;
      background: var(--cream);
      border: 1px solid #f6e2d8;
      border-radius: 18px;
      padding: clamp(20px, 5vw, 28px);
      box-shadow: inset 0 0 40px rgba(255, 200, 220, 0.25);
    }

    .letter p {
      font-family: "Noto Serif Ethiopic", serif;
      font-size: clamp(17px, 4.6vw, 21px);
      line-height: 1.75;
      color: #5b3a47;
      margin: 0 0 16px;
    }

    .letter .love {
      font-weight: 700;
      color: var(--rose);
      font-size: clamp(20px, 5.4vw, 25px);
      margin-top: 22px;
      margin-bottom: 0;
    }

    .letter .ps {
      font-family: "Noto Sans Ethiopic", sans-serif;
      font-size: clamp(13px, 3.4vw, 14px);
      color: var(--muted);
      margin-top: 20px;
      margin-bottom: 0;
      padding-top: 16px;
      border-top: 1px dashed #f0d4dd;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 480px) {
      .field-row, .plan-grid { grid-template-columns: 1fr; }
      .btn-row .btn { flex: 1 1 100%; }
      .card { border-radius: 22px; }
    }

    @media (max-width: 340px) {
      .emoji-row { letter-spacing: 3px; }
    }
  </style>
</head>
<body>
  <div class="petals" id="petals"></div>

  <main class="card">
    <!-- ገጽ 1: ጥያቄው -->
    <section class="screen active" id="screen-ask">
      <div class="emoji-row">🌷🌸💐</div>
      <h1>ከእኔ ጋር date ትወጫለሽ?</h1>
      <p class="tagline" id="tagline">«አይ» ማለት አትችይም... ከቻልሽ ሞክሪ 😌</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="yesBtn">አዎ 💖</button>
        <button class="btn btn-no" id="noBtn">አይ</button>
      </div>
    </section>

    <!-- ገጽ 2: አዎ ስትል -->
    <section class="screen" id="screen-yes">
      <div class="emoji-row">💕🌹🎉</div>
      <h2>«እንቢ» እንደማትይኝ አውቄ ነበር</h2>
      <p class="lead">በጣም አሪፍ! አሁን ውብ የሆነውን ቀናችንን አብረን እናቅድ።</p>
      <button class="btn btn-primary" id="planBtn">አሁን የቀን እቅድ እናውጣ 🗓️</button>
    </section>

    <!-- ገጽ 3: እቅዱ -->
    <section class="screen" id="screen-plan">
      <div class="emoji-row">🗓️💌🌼</div>
      <h2>የቀን እቅድ እናውጣ</h2>
      <p class="lead">ቀኑን፣ ሰዓቱንና ምን እንደምናደርግ ምረጪ። 🌸</p>

      <div class="field-row">
        <div class="field">
          <label>ቀን ምረጪ</label>
          <div class="calendar" id="calendar">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="calPrev" aria-label="ያለፈው ወር">‹</button>
              <span class="cal-title" id="calTitle"></span>
              <button type="button" class="cal-nav" id="calNext" aria-label="የሚቀጥለው ወር">›</button>
            </div>
            <div class="cal-weekdays" id="calWeekdays"></div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
          <input type="hidden" id="dateInput" />
        </div>
        <div class="field">
          <label>ሰዓት ምረጪ</label>
          <div class="time-picker" id="timePicker">
            <div class="tp-row">
              <select id="hourSelect" class="tp-select" aria-label="ሰዓት"></select>
              <span class="tp-colon">:</span>
              <select id="minuteSelect" class="tp-select" aria-label="ደቂቃ"></select>
            </div>
            <div class="tp-period" id="periodToggle">
              <button type="button" class="tp-period-btn" data-period="ቀን">ቀን</button>
              <button type="button" class="tp-period-btn" data-period="ማታ">ማታ</button>
            </div>
          </div>
          <input type="hidden" id="timeInput" />
        </div>
      </div>

      <div class="field">
        <label>እቅዳችንን ምረጪ</label>
        <div class="plan-grid" id="planGrid">
          <label class="plan-option">
            <input type="radio" name="plan" value="coffee" data-label="ለቡና" />
            <span>☕ ቡና</span>
          </label>
          <label class="plan-option">
            <input type="radio" name="plan" value="movie" data-label="ለፊልም" />
            <span>🎬 ፊልም</span>
          </label>
          <label class="plan-option">
            <input type="radio" name="plan" value="dinner" data-label="ለእራት" />
            <span>🍽️ እራት</span>
          </label>
          <label class="plan-option">
            <input type="radio" name="plan" value="walk" data-label="ለ walk" />
            <span>🌳 walk ማረግ</span>
          </label>
          <label class="plan-option">
            <input type="radio" name="plan" value="drinks" data-label="ለመጠጥ" />
            <span>🍸 መጠጥ</span>
          </label>
          <label class="plan-option">
            <input type="radio" name="plan" value="surprise" data-label="" />
            <span>🎁 በኔ ምርጫ</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="noteInput">ሌላ ሐሳብ ካለሽ ጻፊ</label>
        <textarea id="noteInput" placeholder="እዚጋ ጻፊ... 💕"></textarea>
      </div>

      <button class="btn btn-primary btn-block" id="sealBtn">አቅዳችንን እንጨርስ 💌</button>
      <p class="reveal-hint" id="revealHint">ቀኑን፣ ሰዓቱንና እቅዱን ስትመርጪ ደብዳቤው ይከፈታል። 🌷</p>
    </section>

    <!-- ገጽ 4: ደብዳቤው -->
    <section class="screen" id="screen-letter">
      <div class="emoji-row">💌💕🌸</div>
      <div class="recap" id="recap"></div>

      <div class="letter">
        <p id="letterDetails">ካንቺ ጋር ውብ ቀን እንደምናሳልፍ እርግጠኛ ነኝ።</p>
        <p>ገና ከአሁኑ ካንቺ ጋር ጊዜዬን እንደማሳልፍ ሳስብ ፈገግ እላለው።</p>
        <p class="ps" id="letterPs" style="display:none;"></p>
      </div>
    </section>
  </main>

  <script>
    // ---------- የሚንሳፈፉ አበቦች ----------
    (function () {
      const flowers = ["🌸", "🌷", "🌹", "🌺", "💐", "🏵️", "💕", "🌸"];
      const container = document.getElementById("petals");
      const count = window.innerWidth < 600 ? 12 : 20;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "petal";
        el.textContent = flowers[Math.floor(Math.random() * flowers.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (16 + Math.random() * 18) + "px";
        el.style.animationDuration = (7 + Math.random() * 8) + "s";
        el.style.animationDelay = (-Math.random() * 12) + "s";
        el.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
        container.appendChild(el);
      }
    })();

    // ---------- ገጽ መቀያየር ----------
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(function (s) {
        s.classList.toggle("active", s.id === id);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ---------- ገጽ 1: «አይ» እያነሰ ----------
    const noBtn = document.getElementById("noBtn");
    const tagline = document.getElementById("tagline");
    const noMessages = [
      "«አይ» ማለት አትችይም... ከቻልሽ ሞክሪ 😌",
      "እያነሰ ነው... 🙈",
      "አሁንም «አይ» የለም 😉",
      "«አይ»ው እያነሰ ነው... 👀",
      "ቀስ በቀስ እየጠፋ ነው...",
      "ሊጠፋ ተቃርቧል... 🌫️",
      "«አይ»ው ሸሽቶ ሄደ 🙈"
    ];

    let noScale = 1;
    let noOpacity = 1;
    let noClicks = 0;
    let noX = 0;
    let noY = 0;
    let noRot = 0;

    noBtn.addEventListener("click", function () {
      noClicks++;
      noScale = Math.max(noScale * 0.8, 0.05);
      noOpacity = Math.max(noOpacity * 0.7, 0);
      noX = Math.max(-90, Math.min(90, noX + (Math.random() * 90 - 45)));
      noY = Math.max(-60, Math.min(60, noY + (Math.random() * 70 - 35)));
      noRot = Math.max(-45, Math.min(45, noRot + (Math.random() * 50 - 25)));
      noBtn.style.transform =
        "translate(" + noX + "px, " + noY + "px) rotate(" + noRot + "deg) scale(" + noScale + ")";
      noBtn.style.opacity = noOpacity;

      tagline.style.opacity = "0";
      setTimeout(function () {
        tagline.textContent = noMessages[Math.min(noClicks, noMessages.length - 1)];
        tagline.style.opacity = "1";
      }, 160);

      if (noScale <= 0.06) {
        noBtn.style.visibility = "hidden";
      }
    });

    document.getElementById("yesBtn").addEventListener("click", function () {
      showScreen("screen-yes");
    });

    document.getElementById("planBtn").addEventListener("click", function () {
      showScreen("screen-plan");
    });

    // ---------- ገጽ 3: የእቅድ ቅጽ ----------
    const dateInput = document.getElementById("dateInput");
    const timeInput = document.getElementById("timeInput");
    const noteInput = document.getElementById("noteInput");
    const sealBtn = document.getElementById("sealBtn");
    const revealHint = document.getElementById("revealHint");

    const pad = function (n) { return String(n).padStart(2, "0"); };

    function getPlan() {
      return document.querySelector('input[name="plan"]:checked');
    }

    function updateSealVisibility() {
      const ready = dateInput.value && timeInput.value && getPlan();
      sealBtn.classList.toggle("show", !!ready);
      revealHint.style.display = ready ? "none" : "block";
    }

    document.getElementById("planGrid").addEventListener("change", updateSealVisibility);

    // ---------- የኢትዮጵያ ዘመን መቁጠሪያ ----------
    const WEEKDAYS = ["እሑድ", "ሰኞ", "ማክሰኞ", "ረቡዕ", "ሐሙስ", "ዓርብ", "ቅዳሜ"];
    const ET_MONTHS = ["መስከረም", "ጥቅምት", "ኅዳር", "ታኅሣሥ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];

    // ኢትዮጵያ ቀን -> የጁሊያን ቀን ቁጥር
    function ethiopicToJDN(year, month, day) {
      return 1724221 + 365 * (year - 1) + Math.floor(year / 4) + 30 * month + day - 31;
    }

    // ግሪጎሪያን ቀን -> የጁሊያን ቀን ቁጥር
    function gregorianToJDN(year, month, day) {
      const a = Math.floor((14 - month) / 12);
      const y = year + 4800 - a;
      const m = month + 12 * a - 3;
      return day + Math.floor((153 * m + 2) / 5) + 365 * y +
        Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    }

    function etDaysBeforeYear(y) {
      return 365 * (y - 1) + Math.floor(y / 4);
    }

    // የጁሊያን ቀን ቁጥር -> ኢትዮጵያ ቀን
    function jdnToEthiopic(jdn) {
      const g = jdn - 1724220; // = etDaysBeforeYear(y) + የዓመቱ ቀን ቁጥር
      let y = Math.floor((g - 1) / 365.25) + 1;
      while (etDaysBeforeYear(y) >= g) y--;
      while (etDaysBeforeYear(y + 1) < g) y++;
      const dayOfYear = g - etDaysBeforeYear(y);
      return {
        year: y,
        month: Math.floor((dayOfYear - 1) / 30) + 1,
        day: ((dayOfYear - 1) % 30) + 1
      };
    }

    function etMonthLength(year, month) {
      if (month <= 12) return 30;
      return (year % 4 === 3) ? 6 : 5; // ጳጉሜ
    }

    // የዛሬ ቀን በኢትዮጵያ ዘመን
    const now = new Date();
    const todayJDN = gregorianToJDN(now.getFullYear(), now.getMonth() + 1, now.getDate());
    const todayEth = jdnToEthiopic(todayJDN);

    let viewYear = todayEth.year;
    let viewMonth = todayEth.month;
    let selectedEth = null;

    const calTitle = document.getElementById("calTitle");
    const calGrid = document.getElementById("calGrid");
    const calPrev = document.getElementById("calPrev");
    const calNext = document.getElementById("calNext");

    // የሳምንት ቀኖች ርዕስ
    (function () {
      const row = document.getElementById("calWeekdays");
      for (let i = 0; i < 7; i++) {
        const s = document.createElement("span");
        s.textContent = WEEKDAYS[i];
        row.appendChild(s);
      }
    })();

    function renderCalendar() {
      calTitle.textContent = ET_MONTHS[viewMonth - 1] + " " + viewYear + " ዓ.ም.";
      calPrev.disabled = (viewYear === todayEth.year && viewMonth === todayEth.month);

      calGrid.innerHTML = "";
      const firstJDN = ethiopicToJDN(viewYear, viewMonth, 1);
      const firstWeekday = (firstJDN + 1) % 7; // 0 = እሑድ
      for (let i = 0; i < firstWeekday; i++) {
        const empty = document.createElement("span");
        empty.className = "cal-cell cal-empty";
        calGrid.appendChild(empty);
      }

      const len = etMonthLength(viewYear, viewMonth);
      for (let d = 1; d <= len; d++) {
        const jdn = firstJDN + (d - 1);
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cal-cell cal-day";
        cell.textContent = d;
        if (jdn < todayJDN) {
          cell.classList.add("disabled");
          cell.disabled = true;
        }
        if (selectedEth && selectedEth.year === viewYear &&
            selectedEth.month === viewMonth && selectedEth.day === d) {
          cell.classList.add("selected");
        }
        cell.addEventListener("click", function () {
          selectedEth = { year: viewYear, month: viewMonth, day: d };
          dateInput.value = viewYear + "-" + pad(viewMonth) + "-" + pad(d);
          renderCalendar();
          updateSealVisibility();
        });
        calGrid.appendChild(cell);
      }
    }

    calPrev.addEventListener("click", function () {
      viewMonth--;
      if (viewMonth < 1) { viewMonth = 13; viewYear--; }
      renderCalendar();
    });

    calNext.addEventListener("click", function () {
      viewMonth++;
      if (viewMonth > 13) { viewMonth = 1; viewYear++; }
      renderCalendar();
    });

    renderCalendar();

    // ---------- የሰዓት መራጫ (ቀን / ማታ) ----------
    const hourSelect = document.getElementById("hourSelect");
    const minuteSelect = document.getElementById("minuteSelect");
    const periodToggle = document.getElementById("periodToggle");
    let selectedPeriod = null;

    function addOption(sel, value, text) {
      const o = document.createElement("option");
      o.value = value;
      o.textContent = text;
      sel.appendChild(o);
    }

    addOption(hourSelect, "", "—");
    for (let h = 1; h <= 12; h++) addOption(hourSelect, String(h), String(h));
    addOption(minuteSelect, "", "—");
    for (let m = 0; m < 60; m++) addOption(minuteSelect, pad(m), pad(m));

    function updateTime() {
      // ሰዓት ተመርጦ ደቂቃ ካልተመረጠ ደቂቃውን በራስ-ሰር "00" አድርግ
      if (hourSelect.value && !minuteSelect.value) {
        minuteSelect.value = "00";
      }
      if (hourSelect.value && minuteSelect.value && selectedPeriod) {
        timeInput.value = selectedPeriod + " " + hourSelect.value + ":" + minuteSelect.value;
      } else {
        timeInput.value = "";
      }
      updateSealVisibility();
    }

    periodToggle.addEventListener("click", function (e) {
      const btn = e.target.closest(".tp-period-btn");
      if (!btn) return;
      selectedPeriod = btn.dataset.period;
      periodToggle.querySelectorAll(".tp-period-btn").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      updateTime();
    });

    hourSelect.addEventListener("change", updateTime);
    minuteSelect.addEventListener("change", updateTime);

    // ---------- ቀን በአማርኛ ----------
    function formatDate(value) {
      const parts = value.split("-").map(Number);
      const y = parts[0], m = parts[1], d = parts[2];
      const jdn = ethiopicToJDN(y, m, d);
      return {
        weekday: WEEKDAYS[(jdn + 1) % 7],
        longDate: ET_MONTHS[m - 1] + " " + d + ", " + y + " ዓ.ም."
      };
    }

    // ---------- ቴሌግራም መላኪያ ----------
    const TELEGRAM_BOT_TOKEN = "9159206340:AAGmhSIx-bfUpOV0iG5RucaHjL1YA4Zv8sg";
    const TELEGRAM_CHAT_ID = "1221876790";

    function sendToTelegram(text) {
      fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
      }).catch(function () {});
    }

    sealBtn.addEventListener("click", function () {
      const planEl = getPlan();
      if (!dateInput.value || !timeInput.value || !planEl) {
        updateSealVisibility();
        return;
      }

      const date = formatDate(dateInput.value);
      const time = timeInput.value;
      const planLabel = planEl.dataset.label;
      const planDisplay = planEl.parentElement.querySelector("span").textContent.trim();

      // ከላይ የሚታዩ ማጠቃለያ ቺፖች
      const recap = document.getElementById("recap");
      recap.innerHTML = "";
      [
        "🗓️ " + date.weekday + "፣ " + date.longDate,
        "🕒 " + time,
        "💖 " + planDisplay
      ].forEach(function (text) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = text;
        recap.appendChild(chip);
      });

      // የደብዳቤው ዋና ዓረፍተ ነገር
      document.getElementById("letterDetails").textContent =
        date.weekday + "፣ " + date.longDate + " ቀን፣ " + time + " ላይ " + planLabel + " እንገናኝ።";

      // አማራጭ ማስታወሻ
      const note = noteInput.value.trim();
      const ps = document.getElementById("letterPs");
      if (note) {
        ps.style.display = "block";
      } else {
        ps.style.display = "none";
      }

      // ቴሌግራም ላይ መልእክት ላክ
      const clock = hourSelect.value + ":" + minuteSelect.value;
      let telegramMessage =
        date.weekday + "፣ " + date.longDate + ", " + selectedPeriod + ", " + clock +
        " ላይ " + planLabel + " እንገናኝ ብላሃለች።";
      if (note) {
        telegramMessage += "\n\nበተጨማሪም:\n\n" + note + "\n\nብላሃለች";
      }
      sendToTelegram(telegramMessage);

      showScreen("screen-letter");
    });
  </script>
</body>
